<svg width="776" height="540" viewBox="0 0 776 540" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="16" width="320" height="78" rx="10" fill="rgba(194,98,10,0.10)" stroke="rgba(194,98,10,0.55)" stroke-width="1" /><text x="200" y="48" font-size="19" font-weight="bold" fill="#E9F0FB" text-anchor="middle">预测偏差</text><text x="200" y="74" font-size="13" fill="rgba(233,240,251,0.55)" text-anchor="middle">模型输出明显偏离实际负荷</text><line x1="200" y1="94" x2="200" y2="126" stroke="#0891B2" stroke-width="2" /><path d="M 200 134 L 205 124 L 195 124 Z" fill="#0891B2" /><rect x="40" y="138" width="320" height="78" rx="10" fill="rgba(233,240,251,0.05)" stroke="rgba(233,240,251,0.20)" stroke-width="1" /><text x="200" y="170" font-size="19" font-weight="bold" fill="#E9F0FB" text-anchor="middle">往年同期 × 经验因子</text><text x="200" y="196" font-size="13" fill="rgba(233,240,251,0.55)" text-anchor="middle">人工拍一个修正系数，无数据依据</text><line x1="200" y1="216" x2="200" y2="248" stroke="#0891B2" stroke-width="2" /><path d="M 200 256 L 205 246 L 195 246 Z" fill="#0891B2" /><rect x="40" y="260" width="320" height="78" rx="10" fill="rgba(233,240,251,0.05)" stroke="rgba(233,240,251,0.20)" stroke-width="1" /><text x="200" y="292" font-size="19" font-weight="bold" fill="#E9F0FB" text-anchor="middle">临时预测</text><text x="200" y="318" font-size="13" fill="rgba(233,240,251,0.55)" text-anchor="middle">应急研判可用，精度无人担保</text><line x1="200" y1="338" x2="200" y2="370" stroke="#0891B2" stroke-width="2" /><path d="M 200 378 L 205 368 L 195 368 Z" fill="#0891B2" /><rect x="40" y="382" width="320" height="86" rx="10" fill="rgba(8,145,178,0.10)" stroke="rgba(8,145,178,0.60)" stroke-width="1.5" /><text x="200" y="416" font-size="19" font-weight="bold" fill="#E9F0FB" text-anchor="middle">峰值风险研判 / 重过载应对</text><text x="200" y="442" font-size="13" fill="rgba(233,240,251,0.55)" text-anchor="middle">一切只能靠人来兜底</text><path d="M 360 177 C 400 177, 400 190, 424 190" stroke="rgba(194,98,10,0.5)" stroke-width="1.5" stroke-dasharray="4 4" fill="none" /><rect x="428" y="138" width="324" height="200" rx="10" fill="rgba(194,98,10,0.06)" stroke="rgba(194,98,10,0.45)" stroke-width="1" stroke-dasharray="6 5" /><text x="452" y="172" font-size="15" font-weight="bold" fill="#C2620A">而要从模型层面介入 · 遥不可及</text><text x="452" y="206" font-size="14" fill="rgba(233,240,251,0.75)">重新优化要走立项、采购或运维流程</text><text x="452" y="236" font-size="14" fill="rgba(233,240,251,0.75)">耗时一到两个月</text><text x="452" y="266" font-size="14" fill="rgba(233,240,251,0.75)">没有算法团队，也没有自行迭代权限</text><text x="452" y="300" font-size="13" fill="rgba(233,240,251,0.50)">——旺季的高峰，等不起两个月</text><line x1="40" y1="496" x2="752" y2="496" stroke="rgba(233,240,251,0.12)" stroke-width="1" /><text x="40" y="526" font-size="14" fill="rgba(233,240,251,0.55)">临时预测能应急，但误差随季节漂移持续放大——而每次模型修复，都要把项目重做一遍。</text></svg>